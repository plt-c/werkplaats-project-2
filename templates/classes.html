<!---/*HTML OF CLASS OVERZICHT*/-->
{% extends "base.html" %}
{% block content %}

<h1>Klassenlijst</h1>

<table>
    <tr>
        <th>ID</th>
        <th>Klasnaam</th>
        <th>Acties</th>
    </tr>

    {% for c in classes %}
    <tr>
        <td>{{ c.id }}</td>
        <td>{{ c.class_name }}</td>
        <td>
            <a href="/classes/{{ c.id }}">Bekijk studenten</a> |
            <a href="/classes/edit/{{ c.id }}">Bewerken</a>
        </td>
    </tr>
    {% endfor %}
</table>

<br>

<a href="/classes/add">➕ Nieuwe klas toevoegen</a>

{% endblock %}
