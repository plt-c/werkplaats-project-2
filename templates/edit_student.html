<!--/*HTML OM STUDENTEN TE BEWERKEN*/-->
{% extends "base.html" %}
{% block content %}

<h1>Student bewerken</h1>

<form action="/students/edit/{{ student.id }}" method="post">

    <label for="first_name">Voornaam:</label>
    <input id="first_name" type="text" name="first_name" value="{{ student.first_name }}" required>

    <label for="last_name">Achternaam:</label>
    <input id="last_name" type="text" name="last_name" value="{{ student.last_name }}" required>

    <label for="birthdate">Geboortedatum:</label>
    <input id="birthdate" type="date" name="birthdate" value="{{ student.birthdate }}" max="{{ today }}" required>

    <p role="status">Leeftijd: <strong>{{ age }}</strong></p>

    <label for="class_id">Klas:</label>
    <select id="class_id" name="class_id" required>
        {% for c in classes %}
            <option value="{{ c.id }}" {% if c.id == student.class_id %}selected{% endif %}>
                {{ c.class_name }}
            </option>
        {% endfor %}
    </select>

    <button type="submit">Opslaan</button>
</form>

<a href="/students">← Terug naar studentenlijst</a>

{% endblock %}
